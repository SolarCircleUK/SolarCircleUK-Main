<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar Circle - Local Solar Leaderboards</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .th-sortable { cursor: pointer; user-select: none; }
        .th-sortable:hover { color: #f59e0b; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen">
    <header class="border-b border-gray-800 bg-gray-900 sticky top-0 z-50">
        </header>

    <main class="max-w-6xl mx-auto px-4 py-8">
        </main>

    <script>
        let currentSortField = 'es'; 
        let currentSortDirection = 'desc';
        let globalPostcodeData = [];

        // Your Config
        const userConfig = JSON.parse(localStorage.getItem('solarCircleProfile')) || {
            username: "EcoHome-Benfleet",
            capacity: 10.56,
            orientation: "east_west"
        };

        const solarCircleDatabase = {
            "SS7": {
                "2026-05-21": [
                    { id: `${userConfig.username} (You)`, size: userConfig.capacity, dbKey: userConfig.orientation, orientation: "East / West Split", generation: 0, battery: true, baseLiveKw: 0, es: 0, ses: 0, connectedDays: 6, weather: "☀️", status: "green" },
                    { id: "SunnySouth-SS7", size: 4.20, dbKey: "south", orientation: "South", generation: 18.4, battery: false, baseLiveKw: 1.220, es: 4.38, ses: 0.95, connectedDays: 105, weather: "", status: "green" }
                ]
            }
        };

        // INTEGRATED FETCH LOGIC
        async function loadLiveSolarCircleData() {
            const targetPostcode = document.getElementById("postcodeInput").value.trim().toUpperCase();
            
            try {
                const url = `https://solar-circle-backend-production.up.railway.app/api/live_stats?capacity=${userConfig.capacity}`;
                const response = await fetch(url);
                const liveData = await response.json();
                
                if (liveData.status === "success" && solarCircleDatabase[targetPostcode]) {
                    const dataset = solarCircleDatabase[targetPostcode]["2026-05-21"];
                    const userRow = dataset.find(user => user.id.includes("(You)"));
                    
                    if (userRow) {
                        userRow.baseLiveKw = liveData.metrics.pac;
                        userRow.generation = liveData.metrics.e_today;
                        userRow.es = liveData.metrics.es;
                        userRow.ses = liveData.metrics.ses;
                    }
                }
            } catch (error) {
                console.warn("API Offline, using cache");
            }
            updateSummaryCards(targetPostcode);
        }

        // Keep your renderTable, setSort, and updateSummaryCards functions exactly as they were!
        // ... (rest of your existing script functions)
        
        window.onload = function() { loadLiveSolarCircleData(); };
    </script>
</body>
</html>
