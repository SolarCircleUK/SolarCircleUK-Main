<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar Circle - Connect Your Array</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen flex flex-col justify-between">

    <main class="max-w-md mx-auto px-4 py-12">
        <div class="bg-gray-800 p-8 rounded-xl border border-gray-700 shadow-2xl">
            <h2 class="text-2xl font-black text-white mb-6 text-center">JOIN THE CIRCLE</h2>
            
            <form id="registrationForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Leaderboard Username</label>
                    <input type="text" id="regUsername" required class="w-full bg-gray-900 text-white px-3 py-2 rounded-lg border border-gray-700 focus:outline-none focus:ring-2 focus:ring-yellow-500 text-sm">
                </div>
                <button type="submit" class="w-full bg-yellow-500 py-3 rounded-lg font-black text-gray-900">Create Account</button>
            </form>
            <div id="formMsg" class="hidden mt-4 text-center text-xs font-bold"></div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Use a unique name for the client to avoid collisions
        const supabaseUrl = 'https://czclwtgzgndvmmzkzvhw.supabase.co'; 
        const supabaseAnonKey = 'sb_publishable_adGU-iSun2S6ItEH0K1UgA_QQNIec6j'; 
        
        // Check if global supabase is already defined before creating it
        window.supabaseClient = window.supabaseClient || supabase.createClient(supabaseUrl, supabaseAnonKey);

        function generateSolarUsername() {
            const prefixes = ["Solar", "Eco", "Ray", "Sun", "PV", "Volt"];
            const suffixes = ["Ranger", "Chaser", "Core", "Nexus", "Pulse"];
            const p = prefixes[Math.floor(Math.random() * prefixes.length)];
            const s = suffixes[Math.floor(Math.random() * suffixes.length)];
            const field = document.getElementById('regUsername');
            if (field) field.value = `${p}${s}-${Math.floor(1000 + Math.random() * 9000)}`;
        }

        // Run this once the DOM is ready
        document.addEventListener('DOMContentLoaded', generateSolarUsername);
    </script>
</body>
</html>
