<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar Circle - Connect Your Array</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen flex flex-col">

    <header class="border-b border-gray-800 bg-gray-900 px-4 py-4">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
             <a href="indexdata.html" class="flex flex-col group transition-opacity hover:opacity-90">
                    <span class="text-xl font-black tracking-tight bg-gradient-to-r from-yellow-400 to-orange-500 bg-clip-text text-transparent">SOLAR CIRCLE</span>
                    <span class="text-[10px] uppercase tracking-widest text-gray-400 group-hover:text-amber-400 font-bold mt-0.5 transition-colors">Real Data. Shared Simply.</span>
             </a>
            <a href="indexdata.html" class="text-xs font-bold text-gray-400 hover:text-white transition-colors">&larr; Exit to Dashboard</a>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center px-4 py-8">
        <div class="w-full max-w-md bg-gray-800 p-8 rounded-xl border border-gray-700 shadow-2xl">
            
            <form id="registrationForm" class="space-y-4">
                <h2 class="text-2xl font-black text-white mb-2 uppercase tracking-tight text-center">Join the Circle</h2>
                <p class="text-xs text-gray-400 text-center mb-6">Create your account to start tracking your generation data live.</p>
                
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Email</label>
                    <input type="email" id="regEmail" required class="w-full bg-gray-900 text-white px-3 py-2 rounded-lg border border-gray-700 focus:ring-2 focus:ring-yellow-500 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Password</label>
                    <input type="password" id="regPassword" required minlength="6" class="w-full bg-gray-900 text-white px-3 py-2 rounded-lg border border-gray-700 focus:ring-2 focus:ring-yellow-500 text-sm">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Username</label>
                        <input type="text" id="regUsername" required class="w-full bg-gray-900 text-white px-3 py-2 rounded-lg border border-gray-700 focus:ring-2 focus:ring-yellow-500 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">System (kWp)</label>
                        <input type="number" id="regSize" required step="0.01" class="w-full bg-gray-900 text-white px-3 py-2 rounded-lg border border-gray-700 focus:ring-2 focus:ring-yellow-500 text-sm">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Inverter Manufacturer</label>
                    <select id="regInverterBrand" class="w-full bg-gray-900 text-white px-3 py-2 rounded-lg border border-gray-700 text-sm">
                        <option value="solis">Solis</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Postcode</label>
                    <input type="text" id="regPostcode" required class="w-full bg-gray-900 text-white px-3 py-2 rounded-lg border border-gray-700 focus:ring-2 focus:ring-yellow-500 text-sm">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Have Battery?</label>
                        <select id="regHasBattery" onchange="toggleBatteryField()" class="w-full bg-gray-900 text-white px-3 py-2 rounded-lg border border-gray-700 text-sm">
                            <option value="no">No</option>
                            <option value="yes">Yes</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Battery Size (kWh)</label>
                        <input type="number" id="regBatterySize" disabled class="w-full bg-gray-900 text-gray-500 px-3 py-2 rounded-lg border border-gray-700 text-sm disabled:opacity-50">
                    </div>
                </div>

                <div class="pt-2 border-t border-gray-700">
                    <p class="text-[10px] text-gray-500 uppercase font-bold mb-2">Optional Details</p>
                    <div class="grid grid-cols-2 gap-4">
                        <input type="text" id="regPanelBrand" placeholder="Panel Brand" class="w-full bg-gray-900 text-white px-3 py-2 rounded-lg border border-gray-700 text-sm">
                        <input type="number" id="regPanelRating" 
       placeholder="Panel Rating (W)" 
       maxlength="3" 
       min="0" 
       max="999" 
       class="w-full bg-gray-900 text-white px-3 py-2 rounded-lg border border-gray-700 text-sm">
                    </div>
                    <input type="text" id="regBatteryBrand" placeholder="Battery Brand" class="w-full bg-gray-900 text-white px-3 py-2 rounded-lg border border-gray-700 text-sm mt-2">
                </div>

                <button type="submit" class="w-full bg-gradient-to-r from-yellow-500 to-orange-500 text-gray-900 font-black py-3 rounded-lg mt-4 uppercase text-xs tracking-widest hover:from-yellow-400 transition-all">Create Account ☀️</button>
            </form>

            <div id="apiStep" class="hidden space-y-4">
                <h2 class="text-2xl font-black text-white text-center">One Last Step!</h2>
                <p class="text-xs text-gray-400 text-center mb-6">Enter your Solis API details to start syncing.</p>
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">API Token</label>
                    <input type="text" id="apiToken" placeholder="Paste your Solis API Token" class="w-full bg-gray-900 text-white px-3 py-2 rounded-lg border border-gray-700 focus:ring-2 focus:ring-yellow-500 text-sm">
                </div>
                <button onclick="saveApiKeys()" class="w-full bg-gradient-to-r from-yellow-500 to-orange-500 text-gray-900 font-black py-3 rounded-lg uppercase text-xs tracking-widest hover:from-yellow-400 transition-all">Connect API 🚀</button>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://czclwtgzgndvmmzkzvhw.supabase.co'; 
        const supabaseAnonKey = 'sb_publishable_adGU-iSun2S6ItEH0K1UgA_QQNIec6j'; 
        window.supabase = window.supabase || supabase.createClient(supabaseUrl, supabaseAnonKey);

        function toggleBatteryField() {
            const hasBattery = document.getElementById('regHasBattery').value;
            const batteryInput = document.getElementById('regBatterySize');
            batteryInput.disabled = (hasBattery !== 'yes');
        }

        // Logic for Form Submission
        document.getElementById('registrationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const { data: authData, error } = await window.supabase.auth.signUp({
                email: document.getElementById('regEmail').value,
                password: document.getElementById('regPassword').value
            });
            if (error) return alert(error.message);

            const payload = {
                username: document.getElementById('regUsername').value,
                capacity: document.getElementById('regSize').value,
                postcode: document.getElementById('regPostcode').value,
                panelBrand: document.getElementById('regPanelBrand').value,
                panelRating: document.getElementById('regPanelRating').value,
                batteryBrand: document.getElementById('regBatteryBrand').value,
                orientation: 'south', // Add defaults if not in form
                shading: 'none',
                inverterBrand: document.getElementById('regInverterBrand').value
            };

            await fetch('https://solar-circle-backend-production.up.railway.app/api/register_user', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authData.session.access_token}` },
                body: JSON.stringify(payload)
            });

            document.getElementById('registrationForm').classList.add('hidden');
            document.getElementById('apiStep').classList.remove('hidden');
        });

        // Logic for saving API key
        async function saveApiKeys() {
            const apiToken = document.getElementById('apiToken').value;
            const { data: { session } } = await window.supabase.auth.getSession();
            const response = await fetch('https://solar-circle-backend-production.up.railway.app/api/save-api-key', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
                body: JSON.stringify({ api_token: apiToken })
            });
            if (response.ok) window.location.href = "indexdata.html";
            else alert("Failed to save API key.");
        }
    </script>
</body>
</html>
